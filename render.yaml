services:
  - type: web
    name: suntrain-dashboard
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --bind 0.0.0.0:$PORT --workers 1 --threads 4 --timeout 120 dashboard.app:server
    envVars:
      - key: SUNTRAIN_PARQUET_GLOB
        value: data/warehouse/train_service_passenger_counts*.parquet
